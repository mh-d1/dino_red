<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Red Runner 3D</title>
<style>
 body { margin:0; overflow:hidden; background:#200; }
 #ui { position:absolute; top:20px; left:20px; color:white; font-size:24px; }
 #menu { position:absolute; top:40%; width:100%; text-align:center; color:white; font-size:28px; }
</style>
</head>
<body>

<div id="ui">Score: <span id="score">0</span></div>
<div id="menu">PRESS ENTER TO START</div>

<script type="module">
import * as THREE from "https://cdn.jsdelivr.net/npm/three@0.161.0/build/three.module.js";
import { GLTFLoader } from "https://cdn.jsdelivr.net/npm/three@0.161.0/examples/jsm/loaders/GLTFLoader.js";

let scene = new THREE.Scene();
let camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
let renderer = new THREE.WebGLRenderer();
renderer.setSize(window.innerWidth, window.innerHeight);
document.body.appendChild(renderer.domElement);

scene.background = new THREE.Color(0x330000);

let light = new THREE.DirectionalLight(0xffffff, 1);
light.position.set(5, 10, 5);
scene.add(light);

let mixer, player;
let clock = new THREE.Clock();
let score = 0;
let isDead = false;
let started = false;
let obstacles = [];
let velocityY = 0;

const loader = new GLTFLoader();
loader.load("player.glb", (gltf) => {
    player = gltf.scene;
    player.position.set(0,0,0);
    scene.add(player);

    mixer = new THREE.AnimationMixer(player);

    player.animRun  = mixer.clipAction(gltf.animations[0]);
    player.animJump = mixer.clipAction(gltf.animations[1]);
    player.animDead = mixer.clipAction(gltf.animations[2]);
});

camera.position.z = 5;
camera.position.y = 2;

// ---------------------------------------------------
// GAME FLOW
// ---------------------------------------------------
function startGame() {
    started = true;
    isDead = false;
    score = 0;
    document.getElementById("score").innerText = 0;
    document.getElementById("menu").style.display = "none";

    player.position.set(0,0,0);
    velocityY = 0;

    obstacles.forEach(o => scene.remove(o));
    obstacles = [];

    if (player.animDead) player.animDead.stop();
    if (player.animRun)  player.animRun.play();
}

function die() {
    isDead = true;
    player.animRun.stop();
    player.animDead.reset().play();

    setTimeout(() => {
        started = false;
        document.getElementById("menu").style.display = "block";
    }, 1200);
}

// ---------------------------------------------------
// CONTROL
// ---------------------------------------------------
window.addEventListener("keydown", e => {
    if (e.code === "Enter" && !started) startGame();
    if (e.code === "Space" && started && !isDead) jump();
});

function jump() {
    if (player.position.y <= 0.01) {
        velocityY = 0.18;
        player.animRun.stop();
        player.animJump.reset().play();
    }
}

// ---------------------------------------------------
// SPAWN OBSTACLE
// ---------------------------------------------------
function spawnObstacle() {
    if (!started || isDead) return;

    let geo = new THREE.BoxGeometry(1,1,1);
    let mat = new THREE.MeshStandardMaterial({ color:0xaa0000 });
    let obs = new THREE.Mesh(geo,mat);
    obs.position.set(10,0.5,0);

    scene.add(obs);
    obstacles.push(obs);
}
setInterval(spawnObstacle, 1800);

// ---------------------------------------------------
// GAME LOOP
// ---------------------------------------------------
function loop() {
    requestAnimationFrame(loop);
    if (mixer) mixer.update(clock.getDelta());

    if (started && !isDead) {
        velocityY -= 0.009;
        player.position.y += velocityY;

        if (player.position.y < 0) {
            player.position.y = 0;
            player.animJump.stop();
            player.animRun.play();
        }

        obstacles.forEach(obs => {
            obs.position.x -= 0.15;

            if (obs.position.x < -5) {
                scene.remove(obs);
                obstacles = obstacles.filter(o => o !== obs);
                score++;
                document.getElementById("score").innerText = score;
            }

            if (Math.abs(obs.position.x - player.position.x) < 1 && player.position.y < 1) {
                die();
            }
        });
    }

    renderer.render(scene, camera);
}
loop();

</script>
</body>
</html>
