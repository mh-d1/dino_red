<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Red Runner 3D Box</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background: #1a0000;
        }
        #ui {
            position: absolute;
            top: 20px;
            left: 20px;
            color: white;
            font-size: 24px;
            font-family: Arial;
        }
    </style>
</head>
<body>
<div id="ui">Score: <span id="score">0</span></div>

<script type="module">
import * as THREE from "https://cdn.jsdelivr.net/npm/three@0.161.0/build/three.module.js";
import { GLTFLoader } from "https://cdn.jsdelivr.net/npm/three@0.161.0/examples/jsm/loaders/GLTFLoader.js";

let scene = new THREE.Scene();
let camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
let renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
document.body.appendChild(renderer.domElement);

scene.background = new THREE.Color(0x330000);

let light = new THREE.DirectionalLight(0xffffff, 1);
light.position.set(5, 10, 5);
scene.add(light);

let mixer;
let player;
let clock = new THREE.Clock();
let score = 0;
let isDead = false;

const loader = new GLTFLoader();
loader.load("player.glb", (gltf) => {
    player = gltf.scene;
    player.scale.set(1.2, 1.2, 1.2);
    scene.add(player);

    mixer = new THREE.AnimationMixer(player);
    const clips = gltf.animations;

    player.animRun = mixer.clipAction(clips[0]);
    player.animJump = mixer.clipAction(clips[1]);
    player.animDead = mixer.clipAction(clips[2]);

    player.animRun.play();
});

camera.position.z = 5;
camera.position.y = 2;

let obstacles = [];
function spawnObstacle() {
    let geo = new THREE.BoxGeometry(1, 1, 1);
    let mat = new THREE.MeshStandardMaterial({ color: 0xaa0000 });
    let obs = new THREE.Mesh(geo, mat);
    obs.position.set(10, 0.5, 0);
    scene.add(obs);
    obstacles.push(obs);
}
setInterval(spawnObstacle, 2000);

let velocityY = 0;
function jump() {
    if (player.position.y <= 0.01 && !isDead) {
        velocityY = 0.18;
        player.animRun.stop();
        player.animJump.reset().play();
    }
}

window.addEventListener("keydown", (e) => {
    if (e.code === "Space") jump();
});

function loop() {
    requestAnimationFrame(loop);

    if (mixer) mixer.update(clock.getDelta());

    if (player && !isDead) {
        velocityY -= 0.009;
        player.position.y += velocityY;
        if (player.position.y < 0) {
            player.position.y = 0;
            player.animJump.stop();
            player.animRun.play();
        }

        obstacles.forEach((obs) => {
            obs.position.x -= 0.15;

            if (obs.position.x < -5) {
                scene.remove(obs);
                obstacles = obstacles.filter(o => o !== obs);
                score++;
                document.getElementById("score").innerText = score;
            }

            if (!isDead && Math.abs(obs.position.x - player.position.x) < 1 && player.position.y < 1) {
                isDead = true;
                player.animRun.stop();
                player.animDead.play();
            }
        });
    }

    renderer.render(scene, camera);
}
loop();

</script>
</body>
</html>
